<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="form-container">

    <h1>Add New Product</h1>

    <form action="/save-product" method="POST">

        <label>Product Name</label>
        <input type="text" name="product_name" placeholder="Enter Product Name" required>

        <label>Category</label>
        <input type="text" name="category" placeholder="Enter Category" required>

        <label>Brand</label>
        <input type="text" name="brand" placeholder="Enter Brand" required>

        <label>Price</label>
        <input type="number" name="price" placeholder="Enter Price" min="0" step="0.01" required>

        <label>Quantity</label>
        <input type="number" name="quantity" placeholder="Enter Quantity" min="0" step="1" required>

        <button type="submit">Save Product</button>

    </form>

</div>

</body>
</html>
